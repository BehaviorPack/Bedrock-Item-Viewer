<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <meta property="og:title" content="Bedrock Item Viewer" />
    <meta
      name="description"
      content="A Minecraft: Bedrock Item Viewer for viewing and filtering character creator items from the marketplace, with various types and tags."
    />
    <meta
      property="og:description"
      content="A Minecraft: Bedrock Item Viewer for viewing and filtering character creator items from the marketplace, with various types and tags."
    />
    <meta
      property="twitter:description"
      content="A Minecraft: Bedrock Item Viewer for viewing and filtering character creator items from the marketplace, with various types and tags."
    />
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/merch/Creator_CreatorPromo_Blog_1170x500.jpg"
    />
    <meta
      property="og:image"
      content="https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/merch/Creator_CreatorPromo_Blog_1170x500.jpg"
    />
    <meta property="og:image:width" content="1170" />
    <meta property="og:image:height" content="500" />
    <meta name="keywords" content="Minecraft, Bedrock, Marketplace, Character Creator, Item Viewer, Persona Pieces" />
    <link rel="canonical" href="https://github.com/BehaviorPack/Bedrock-Item-Viewer/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Bedrock Item Viewer</title>
    <style>
      @import url("html.css");
    </style>
  </head>
  <body>
    <h1>Bedrock Item Viewer</h1>
    <p id="loaded-items">Loaded Items: 0</p>

    <div id="key-art-section" style="display: none; text-align: center; padding: 20px">
      <img id="key-art-image" src="" alt="DLC Key Art" style="max-width: 100%; height: auto; border-radius: 10px" />
      <p id="key-art-description"></p>
      <a
        id="key-art-link"
        href="#"
        target="_blank"
        style="
          display: inline-block;
          padding: 10px 20px;
          background-color: #6a6fcd;
          color: white;
          border-radius: 5px;
          text-decoration: none;
          margin-top: 10px;
        "
        >Learn More</a
      >
    </div>

    <div id="filters">
      <input type="text" id="search-box" placeholder="Search by name..." />
      <select id="tag-selector">
        <option value="">Select a DLC</option>
      </select>
      <select id="type-selector">
        <option value="">Select a Type</option>
      </select>
      <input type="file" id="file-input" accept=".json" />
    </div>

    <div id="personas-container"></div>
    <div id="modal" class="modal">
      <div class="modal-content">
        <button class="close-btn" id="close-btn">X</button>
        <div class="modal-left">
          <h2 id="modal-title">Persona Title</h2>
          <img id="modal-img" src="" alt="Persona Image" />
          <div id="modal-details"></div>
          <img id="modal-render" src="" alt="Render Image" style="display: none; width: 100%; margin-top: 10px" />
          <a href="#" id="view-ingame-btn" class="view-ingame-btn" style="display: none">View In-game</a>
        </div>
      </div>
    </div>

    <script>
      const tagData = {
        "custom.spongebob": {
          image: "https://xforgeassets002.xboxlive.com/.../SpongeBob_packicon.jpg",
          description: "Dive into SpongeBob SquarePants!",
          link: "https://minecraft.wiki/...#Character_creator",
        },
        "custom.sonic": {
          image: "https://xforgeassets001.xboxlive.com/.../Sonic_packicon.jpg",
          description: "Step into comfort with Sonic!",
          link: "https://minecraft.wiki/...#Character_creator",
        },
        // ... more mappings
      };

      let data = {};

      // Event Listeners
      document.getElementById("type-selector").addEventListener("change", filterItems);
      document.getElementById("tag-selector").addEventListener("change", (event) => {
        filterItems();
        updateKeyArt(event.target.value);
      });
      document.getElementById("search-box").addEventListener("input", filterItems);
      document.getElementById("close-btn").addEventListener("click", () => {
        document.getElementById("modal").style.display = "none";
        document.body.classList.remove("modal-open");
      });
      document.getElementById("file-input").addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            data = JSON.parse(ev.target.result);
            initFilters();
            displayPersonas();
          } catch {
            alert("Invalid JSON");
          }
        };
        reader.readAsText(file);
      });

      async function loadData() {
        try {
          const resp = await fetch("./marketplace/data.json");
          if (!resp.ok) throw Error();
          data = await resp.json();
          initFilters();
          displayPersonas();
        } catch (err) {
          console.error("Error loading data", err);
        }
      }
      document.addEventListener("DOMContentLoaded", loadData);

      function initFilters() {
        populateTagSelector();
        populateTypeSelector();
      }

      function formatTagLabel(tag) {
        let label = tag.replace(/^.*\./, "");
        label = label.replace(/_/g, " ");
        return label.charAt(0).toUpperCase() + label.slice(1);
      }

      function populateTagSelector() {
        const sel = document.getElementById("tag-selector");
        sel.innerHTML = '<option value="">Select a DLC</option>';
        const tagCounts = {};
        // Count tags, filtering out UUIDs
        const uuidRegex = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
        data.data.Items.forEach((item) => {
          item.Tags.forEach((t) => {
            if (!uuidRegex.test(t)) {
              tagCounts[t] = (tagCounts[t] || 0) + 1;
            }
          });
        });
        Object.keys(tagCounts)
          .sort((a, b) => tagCounts[b] - tagCounts[a])
          .forEach((tag) => {
            const opt = document.createElement("option");
            opt.value = tag;
            opt.textContent = `${formatTagLabel(tag)} (${tagCounts[tag]})`;
            sel.appendChild(opt);
          });
      }

      function convertPieceType(pt) {
        const map = {
          persona_emote: "Emote",
          persona_top: "Top",
          persona_head: "Headwear",
          persona_hood: ["Outerwear", "Headwear"],
          persona_back: "Back Item",
          persona_feet: "Footwear",
          persona_capes: "Cape",
          persona_face_accessory: "Face Item",
          persona_outerwear: "Outerwear",
          persona_bottom: "Bottoms",
          persona_hand: "Gloves",
          persona_high_pants: ["Bottoms", "Top"],
        };
        return map[pt] || pt;
      }

      function populateTypeSelector() {
        const sel = document.getElementById("type-selector");
        sel.innerHTML = '<option value="">Select a Type</option>';
        const types = {};
        data.data.Items.forEach((item) => {
          const pt = item.DisplayProperties.pieceType;
          types[pt] = (types[pt] || 0) + 1;
        });
        Object.entries(types)
          .sort(([, a], [, b]) => b - a)
          .forEach(([pt, count]) => {
            const opt = document.createElement("option");
            opt.value = pt;
            const label = convertPieceType(pt);
            opt.textContent = Array.isArray(label) ? `${label.join("/")} (${count})` : `${label} (${count})`;
            sel.appendChild(opt);
          });
      }

      function filterItems() {
        const selTag = document.getElementById("tag-selector").value;
        const selType = document.getElementById("type-selector").value;
        const query = document.getElementById("search-box").value.toLowerCase();
        const container = document.getElementById("personas-container");
        container.innerHTML = "";
        let items = data.data.Items.slice();
        if (selTag) items = items.filter((it) => it.Tags.includes(selTag));
        if (selType) items = items.filter((it) => it.DisplayProperties.pieceType === selType);
        if (query) items = items.filter((it) => it.Title.NEUTRAL.toLowerCase().includes(query));
        document.getElementById("loaded-items").textContent = `Loaded Items: ${items.length}`;
        items.forEach(renderPersona);
      }

      function renderPersona(item) {
        const div = document.createElement("div");
        div.classList.add("persona", item.DisplayProperties.rarity);
        div.innerHTML = `<img src="${item.Images[0].Url}" alt="${item.Title.NEUTRAL}"><div class="persona-title">${item.Title.NEUTRAL}</div>`;
        div.addEventListener("click", () => openModal(item));
        document.getElementById("personas-container").appendChild(div);
      }

      function openModal(item) {
        /* existing modal code unchanged */
      }
      function updateKeyArt(tag) {
        /* existing key-art code unchanged */
      }
    </script>
  </body>
</html>
